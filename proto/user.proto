syntax = "proto3";
package im;

import "base.proto";
option cc_generic_services = true;

//用户注册
message UserRegisterRequest {
  string request_id = 1;
  string nickname = 2;
  string password = 3;
  optional string verify_code_id = 4;
  optional string verify_code = 5;
}

message UserRegisterResponse {
  string request_id = 1;
  string error = 2;
  bool success = 3;
};

// 用户登录
message UserLoginRequest {
  string request_id = 1;
  string nickname = 2;
  string password = 3;
  optional string verify_code_id = 4;
  optional string verify_code = 5;
}

message UserLoginResponse {
  string request_id = 1;
  string error = 2;
  string login_session_id = 3;
  bool success = 4;
}

// 手机验证码获取
message PhoneVerifyCodeRequest {
  string request_id = 1;
  string phone_number = 2;
}

message PhoneVerifyCodeResponse {
  string request_id = 1;
  bool success = 2;
  string error = 3;
  string verify_code_id = 4;
}

// 手机号注册
message PhoneRegisterRequest {
  string request_id = 1;
  string phone_number = 2;
  string verify_code_id = 3;
  string verify_code = 4;
}
message PhoneRegisterResponse {
  string request_id = 1;
  bool success = 2;
  string errmsg = 3;
}

//手机号登录
message PhoneLoginRequest {
  string request_id = 1;
  string phone_number = 2;
  string verify_code_id = 3;
  string verify_code = 4;
}

message PhoneLoginResponse {
  string request_id = 1;
  string errmsg = 2;
  string login_session_id = 3;
  bool success = 4;
}

//个人信息获取-这个只用于获取当前登录用户的信息
//  客户端传递的时候只需要填充session_id即可
//其他个人/好友信息的获取在好友操作中完成
message GetUserInfoRequest {
  string request_id = 1;
  optional string user_id = 2;
  optional string session_id = 3;
}

message GetUserInfoResponse {
  string request_id = 1;
  string error = 2;
  bool success = 3;
  UserInfo user_info = 4;
}

message GetMultiUserInfoRequest {
  string request_id = 1;
  repeated string users_id = 2;
}

message GetMultiUserInfoResponse {
  string request_id = 1;
  string error = 2;
  bool success = 3;
  map<string, UserInfo> users_info = 4;
}

// 用户头像修改
message SetUserAvatarRequest {
  string request_id = 1;
  optional string user_id = 2;
  optional string session_id = 3;
  bytes avatar = 4;
}

message SetUserAvatarResponse {
  string request_id = 1;
  string error = 2;
  bool success = 3;
}

//用户昵称修改
message SetUserNicknameRequest {
  string request_id = 1;
  string nickname = 4;
  optional string user_id = 2;
  optional string session_id = 3;
}

message SetUserNicknameResponse {
  string request_id = 1;
  string error = 2;
  bool success = 3;
}

//用户签名修改
message SetUserDescriptionRequest {
  string request_id = 1;
  string description = 4;
  optional string user_id = 2;
  optional string session_id = 3;
}
message SetUserDescriptionResponse {
  string request_id = 1;
  string error = 3;
  bool success = 2;
}

//用户手机修改
message SetUserPhoneNumberRequest {
  string request_id = 1;
  string phone_number = 4;
  string phone_verify_code_id = 5;
  string phone_verify_code = 6;
  optional string user_id = 2;
  optional string session_id = 3;
}
message SetUserPhoneNumberResponse {
  string request_id = 1;
  string error = 3;
  bool success = 2;
}

service UserService {
  rpc UserRegister(UserRegisterRequest) returns (UserRegisterResponse);
  rpc UserLogin(UserLoginRequest) returns (UserLoginResponse);
  rpc GetPhoneVerifyCode(PhoneVerifyCodeRequest) returns (PhoneVerifyCodeResponse);
  rpc PhoneRegister(PhoneRegisterRequest) returns (PhoneRegisterResponse);
  rpc PhoneLogin(PhoneLoginRequest) returns (PhoneLoginResponse);
  rpc GetUserInfo(GetUserInfoRequest) returns (GetUserInfoResponse);
  rpc GetMultiUserInfo(GetMultiUserInfoRequest) returns (GetMultiUserInfoResponse);
  rpc SetUserAvatar(SetUserAvatarRequest) returns (SetUserAvatarResponse);
  rpc SetUserNickname(SetUserNicknameRequest) returns (SetUserNicknameResponse);
  rpc SetUserDescription(SetUserDescriptionRequest) returns (SetUserDescriptionResponse);
  rpc SetUserPhoneNumber(SetUserPhoneNumberRequest) returns (SetUserPhoneNumberResponse);
}