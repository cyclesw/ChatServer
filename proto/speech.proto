syntax = "proto3";
package im;

option cc_generic_services = true;

message SpeechRecognitionRequest {
  string request_id = 1;          // 请求ID
  bytes speech_content = 2;       // 语音数据
  optional string user_id = 3;    // 用户ID
  optional string session_id = 4; // 会话ID
}

message SpeechRecognitionResponse {
  string request_id = 1;              //请求ID
  bool success = 2;                   //请求处理结果标志
  optional string error = 3;         //失败原因
  optional string recognition_result = 4;      //识别后的文字数据
}

//语音识别Rpc服务及接口的定义
service SpeechService {
  rpc SpeechRecognition(SpeechRecognitionRequest) returns (SpeechRecognitionResponse);
}
